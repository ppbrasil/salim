{% extends "base.html" %}
{% block title %}Entrar · Salim{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<h1>Salim</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post" action="/login" style="display:grid;gap:.6rem;max-width:20rem">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Usuário <input name="username" autocomplete="username" autofocus required></label>
  <label>Senha <input type="password" name="password" autocomplete="current-password" required></label>
  <button>Entrar</button>
</form>
{% endblock %}
