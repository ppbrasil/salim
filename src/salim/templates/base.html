<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Salim{% endblock %}</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; color: #1f2328; background: #fafafa; }
  nav { background: #1f2328; padding: .6rem 1.2rem; display: flex; gap: 1.2rem; }
  nav a { color: #fff; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  main { max-width: 980px; margin: 1.5rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e5e5e5; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .group td { font-weight: 600; background: #f3f3f3; }
  .neg { color: #b42318; } .erro { background: #fee4e2; color: #7a271a; padding: .6rem .8rem; border-radius: 6px; }
  .atrasada { color: #b42318; font-weight: 600; } .quitada { color: #067647; }
  input, select, button { font: inherit; padding: .3rem .5rem; } input.val { width: 8rem; text-align: right; }
  .muted { color: #667085; }
  :root { --surface: #fcfcfb; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s9: #9a9a94; }
  main.wide { max-width: 1280px; }
  .card { background: var(--surface); border: 1px solid #e5e5e5; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
  .card h2 { font-size: 1rem; margin: 0 0 .4rem; }
  svg.viz { width: 100%; height: auto; display: block; }
  svg.viz .grid { stroke: #e9e9e6; stroke-width: 1; }
  svg.viz .grid.zero { stroke: #9a9a94; }
  svg.viz .ax { fill: #667085; font-size: 11px; }
  svg.viz rect.seg { stroke: var(--surface); stroke-width: 2; }
  svg.viz .seg:hover { opacity: .8; }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: 13px; color: #52514e; margin-top: .3rem; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .tiles { display: flex; gap: 1rem; flex-wrap: wrap; } .tile { flex: 1 1 160px; }
  .tile .v { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; } .tile .l { color: #667085; font-size: 13px; }
  .scroll { overflow-x: auto; } table.mensal th, table.mensal td { white-space: nowrap; }
  table.mensal td.name, table.mensal th.name { position: sticky; left: 0; background: inherit; min-width: 15rem; }
  table.mensal tr { background: #fff; } table.mensal tr.l0 { background: #eef0f3; font-weight: 700; } table.mensal tr.l1 { background: #f7f7f7; font-weight: 600; }
  table.mensal tr.l2 td.name { padding-left: 2rem; font-weight: 400; } table.mensal tr.hide { display: none; }
  table.mensal tr.l1 td.name { cursor: pointer; } table.mensal .car { display: inline-block; width: 1em; color: #667085; }
  table.mensal tr.res { background: #eef0f3; font-weight: 700; border-top: 2px solid #1f2328; }
  details.acao summary { cursor: pointer; color: #2a78d6; } details.acao form { display: flex; gap: .4rem; flex-wrap: wrap; align-items: end; margin-top: .4rem; }
  details.acao label { font-size: 12px; color: #667085; display: block; } details.itens summary { cursor: pointer; color: #52514e; }
  details.itens table { margin: .3rem 0 .2rem 1rem; width: auto; font-size: 13px; }
  .spark { vertical-align: middle; } button.lnk { background: none; border: 0; color: #2a78d6; cursor: pointer; padding: 0 .3rem; }
</style>
</head>
<body>
{% block nav %}<nav>
  <a href="/ui/accounts">Plano de contas</a>
  <a href="/ui/transactions/new">Novo lançamento</a>
  <a href="/ui/payables">A pagar</a>
  <a href="/ui/receivables">A receber</a>
  <a href="/ui/reports/dre">DRE</a>
  <a href="/ui/reports/cash">Caixa</a>
  <a href="/ui/budget">Orçamento</a>
  {% if request.state.user %}<form method="post" action="/logout" style="margin-left:auto"><button>Sair</button></form>{% endif %}
</nav>{% endblock %}
<main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
