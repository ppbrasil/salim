# Produção: docker compose --profile https up -d --build
# Só local/Tailscale (sem HTTPS público): docker compose up -d --build  → http://127.0.0.1:8000
services:
  salim:
    build: .
    env_file: .env
    environment:
      SALIM_DB_URL: sqlite:////data/salim.db
    ports: ["127.0.0.1:8000:8000"]      # só loopback; o público entra pelo Caddy
    volumes:
      - salim-data:/data
    restart: unless-stopped

  backup:
    build: .
    command: ["python", "-m", "salim.backup", "--loop", "24"]
    environment:
      SALIM_DB_URL: sqlite:////data/salim.db
      SALIM_BACKUP_DIR: /data/backups
      SALIM_BACKUP_KEEP: "30"
    volumes:
      - salim-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on: [salim]
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  salim-data:
  caddy-data:
