[project]
name = "salim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "sqlalchemy>=2", "jinja2", "mcp", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "psycopg[binary]"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
